# Their hooks inside the game's camera code, each acting only while Modern Camera is on
# (camera.cpp). Step B of the follow camera: the distance it keeps, eased.
[[midasm_hook]]
address = 0x823071A4
name = "Ng2CameraStepBDistance"
registers = ["f10", "f12", "f13", "f27", "f31"]

# Step B: a flag kept only in states 79, 86, 87 of the object (r30).
[[midasm_hook]]
address = 0x823073BC
name = "Ng2CameraStepBFlag"
registers = ["r11", "r30"]

# Step D: a block skipped.
[[midasm_hook]]
address = 0x823082A0
name = "Ng2CameraModern"
jump_address_on_true = 0x823084E0

# A turn limit of 3 degrees made 5.
[[midasm_hook]]
address = 0x8230B3AC
name = "Ng2CameraTurnLimit"
registers = ["f12"]

# A call skipped (sub_823038A8).
[[midasm_hook]]
address = 0x823F83B4
name = "Ng2CameraModern"
jump_address_on_true = 0x823F83B8

