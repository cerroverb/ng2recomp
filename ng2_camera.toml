# Modern Camera and OT/UT Free Camera (src/camera.cpp): the camera code of alicenotmech's
# Ninja Gaiden II Master Edition (MIT, see THIRD_PARTY.md), recompiled with the game's.
# Included from ng2_manifest.toml.
#
# mods-builtin/master-edition/camera-codegen.bin: their camera functions, laid over the image
# before analysis (in code caves and over the start of sub_83A42C90, a WMV decoder function of
# the XDK the game never runs here: movies play on the host). Their glue stubs, which branch
# into the middle of game functions, are blanked there and done as hooks below and in camera.cpp.
image_patches = ["mods-builtin/master-edition/camera-codegen.bin"]

